<app-shared-card [fullHeight]="true" justifyActions="justify-content-between">
  <ng-container card-title><span class="text-gradient">{{ project.title }}</span></ng-container>
  
  <ng-container card-date>
    <i class="bi bi-calendar3 me-1"></i>
    {{ project.startDate | date: 'MMM yyyy' }} &mdash;
    {{ project.endDate ? (project.endDate | date: 'MMM yyyy') : 'Present' }}
  </ng-container>

  <ng-container card-badges>
    <span *ngFor="let tech of project.techStack.split(',')" class="premium-badge text-capitalize">
      {{ tech.trim() }}
    </span>
  </ng-container>

  <ng-container card-description>
    <div [innerHTML]="project.description"></div>
  </ng-container>

  <ng-container card-actions>
    <div class="d-flex gap-2">
      <a [href]="project.github" target="_blank" class="btn btn-sm d-flex align-items-center gap-1" title="GitHub Source Code">
        <i class="bi bi-github"></i> Code
      </a>
      <a *ngIf="project.demo" [href]="project.demo" target="_blank" class="btn btn-primary btn-sm d-flex align-items-center gap-1" title="Live Demo">
        <i class="bi bi-box-arrow-up-right"></i> Live
      </a>
    </div>
    <div class="btn-group">
      <button class="btn btn-sm" (click)="viewProject()" title="View Details">
        <i class="bi bi-eye"></i>
      </button>
      <button *ngIf="isAdmin" class="btn btn-sm text-warning" (click)="editProject()" title="Edit Project">
        <i class="bi bi-pencil"></i>
      </button>
      <button *ngIf="isAdmin" class="btn btn-sm text-danger" (click)="onDelete()" title="Delete Project">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </ng-container>
</app-shared-card>
