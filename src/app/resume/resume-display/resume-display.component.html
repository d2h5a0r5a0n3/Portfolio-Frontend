<div class="resume-wrapper">

  <div class="resume-frame-container">
    <iframe
      *ngIf="sanitizedUrl; else noResume"
      [src]="sanitizedUrl"
      class="resume-iframe"
    ></iframe>

    <ng-template #noResume>
      <p class="text-muted text-center mt-4">Resume loading...</p>
    </ng-template>
  </div>
</div>
