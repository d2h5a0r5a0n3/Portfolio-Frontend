<div class="container py-5">
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h3 class="mb-4">Data Migration Manager</h3>
      
      <div *ngIf="message" class="alert alert-info">{{ message }}</div>

      <div class="d-flex justify-content-center gap-4 my-4">
        <button class="btn btn-danger btn-lg" (click)="clearAllData()" [disabled]="isLoading">
          <i class="bi bi-trash me-2"></i> Clear All Data
        </button>
        
        <button class="btn btn-success btn-lg" (click)="seedData()" [disabled]="isLoading">
          <i class="bi bi-cloud-upload me-2"></i> Dump Resume Data
        </button>
      </div>
      
      <p class="text-muted small">
        This is a temporary utility to reset the database and seed the resume data via button click, avoiding duplicate hot-reloads.
      </p>
    </div>
  </div>
</div>
