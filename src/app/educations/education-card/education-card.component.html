<app-shared-card [fullHeight]="true">
  <ng-container card-title><span class="text-gradient">{{ education.degree }} in {{ education.fieldOfStudy }}</span></ng-container>
  
  <ng-container card-subtitle>
    {{ education.institution }}
  </ng-container>

  <ng-container card-date>
    <i class="bi bi-journal-bookmark me-1"></i>
    {{ education.startDate | date: 'MMM yyyy' }} &mdash;
    {{ education.endDate ? (education.endDate | date: 'MMM yyyy') : 'Present' }}
  </ng-container>

  <ng-container card-description>
    <div [innerHTML]="education.description"></div>
  </ng-container>

  <ng-container card-actions>
    <button class="btn btn-sm d-flex align-items-center justify-content-center" (click)="viewEducation()" title="View Details" style="width: 36px; height: 36px; border-radius: 50%;">
      <i class="bi bi-eye"></i>
    </button>
    <button *ngIf="isAdmin" class="btn btn-sm d-flex align-items-center justify-content-center" (click)="editEducation()" title="Edit Education" style="color: #f59e0b; width: 36px; height: 36px; border-radius: 50%;">
      <i class="bi bi-pencil"></i>
    </button>
    <button *ngIf="isAdmin" class="btn btn-sm d-flex align-items-center justify-content-center" (click)="onDelete()" title="Delete Education" style="color: #ef4444; width: 36px; height: 36px; border-radius: 50%;">
      <i class="bi bi-trash"></i>
    </button>
  </ng-container>
</app-shared-card>
