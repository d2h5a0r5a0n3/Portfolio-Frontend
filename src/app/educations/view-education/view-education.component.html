<div class="container py-4" *ngIf="education">
  <div class="mb-4">
    <a routerLink="/educations" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Back to Education
    </a>
  </div>

  <div class="card">
    <div class="card-body">
      <h4 class="card-title mb-2">{{ education.degree }}</h4>
      <h6 class="text-muted mb-3">{{ education.institution }} | {{ education.fieldOfStudy }}</h6>

      <div class="mb-4 text-secondary small">
        <i class="bi bi-calendar-event me-1"></i>
        {{ education.startDate | date: 'MMM yyyy' }} -
        {{ education.endDate ? (education.endDate | date: 'MMM yyyy') : 'Present' }}
      </div>

      <div class="mb-3">
        <h5 class="text-muted mb-3 border-bottom pb-2">Description</h5>
        <div class="description-box" [innerHTML]="education.description"></div>
      </div>
    </div>
  </div>
</div>
