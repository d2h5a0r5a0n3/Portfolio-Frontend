<div class="education-container">
  <div class="timeline-wrapper">
    <div class="timeline-line"></div>
  </div>

  <div class="education-content">
    <div
      class="education-header d-flex justify-content-between align-items-center mb-4"
    >
      <h2 class="mb-0">My Education</h2>
      <button
        *ngIf="isAdmin"
        class="btn btn-primary btn-sm"
        (click)="goToAddEducation()"
      >
        <i class="bi bi-plus-circle me-1"></i> Add Education
      </button>
    </div>

    <div
      class="education-entry"
      *ngFor="let education of educations"
      [@fadeInUp]
    >
      <div
        class="timeline-dot"
        [matTooltip]="education.institution"
        matTooltipPosition="right"
        matTooltipClass="timeline-tooltip"
      >
        {{ education.startDate | date: "yyyy" }}
      </div>
      <app-education-card
        [education]="education"
        (deleteEducation)="deleteEducation($event)"
      >
      </app-education-card>
    </div>
  </div>
</div>
