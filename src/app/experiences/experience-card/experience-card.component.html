<app-shared-card [fullHeight]="true">
  <ng-container card-title><span class="text-gradient">{{ experience.role }}</span></ng-container>
  
  <ng-container card-subtitle>
    {{ experience.company }}
    <span style="color: var(--secondary-text)">• {{ experience.location }}</span>
  </ng-container>

  <ng-container card-date>
    <i class="bi bi-briefcase me-1"></i>
    {{ experience.startDate | date: "MMM yyyy" }} &mdash;
    {{ experience.endDate ? (experience.endDate | date: "MMM yyyy") : "Present" }}
  </ng-container>

  <ng-container card-description>
    <div [innerHTML]="experience.description"></div>
  </ng-container>

  <ng-container card-actions>
    <button class="btn btn-sm d-flex align-items-center justify-content-center" (click)="viewExperience()" title="View Details" style="width: 36px; height: 36px; border-radius: 50%">
      <i class="bi bi-eye"></i>
    </button>
    <button *ngIf="isAdmin" class="btn btn-sm d-flex align-items-center justify-content-center" (click)="editExperience()" title="Edit Experience" style="color: #f59e0b; width: 36px; height: 36px; border-radius: 50%">
      <i class="bi bi-pencil"></i>
    </button>
    <button *ngIf="isAdmin" class="btn btn-sm d-flex align-items-center justify-content-center" (click)="onDelete()" title="Delete Experience" style="color: #ef4444; width: 36px; height: 36px; border-radius: 50%">
      <i class="bi bi-trash"></i>
    </button>
  </ng-container>
</app-shared-card>
