<div class="container py-4" *ngIf="experience">
  <div class="mb-4">
    <a routerLink="/experiences" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Back to Experience
    </a>
  </div>

  <div class="card">
    <div class="card-body">
      <h4 class="card-title mb-2">{{ experience.role }}</h4>
      <h6 class="text-muted mb-3">{{ experience.company }} | {{ experience.location }}</h6>

      <div class="mb-4 text-secondary small">
        <i class="bi bi-calendar-event me-1"></i>
        {{ experience.startDate | date: 'MMM yyyy' }} -
        {{ experience.endDate ? (experience.endDate | date: 'MMM yyyy') : 'Present' }}
      </div>

      <div class="mb-3">
        <h5 class="text-muted mb-3 border-bottom pb-2">Description</h5>
        <div class="description-box" [innerHTML]="experience.description"></div>
      </div>
    </div>
  </div>
</div>
