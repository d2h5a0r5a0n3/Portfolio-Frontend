<app-shared-card [fullHeight]="true">
  <ng-container card-title>
    <div class="d-flex align-items-center mb-0">
      <span class="me-3 text-gradient">{{ skill.name }}</span>
      <i *ngIf="skill.icon" [class]="skill.icon" style="font-size: 2rem;"></i>
    </div>
  </ng-container>
  
  <ng-container card-subtitle>
    {{ skill.skillCategory }} <span style="color: var(--secondary-text)">• {{ skill.proficiency }}</span>
  </ng-container>

  <ng-container card-description>
    <div [innerHTML]="skill.description"></div>
  </ng-container>

  <ng-container card-actions>
    <button class="btn btn-sm d-flex align-items-center justify-content-center" (click)="viewSkill()" title="View Details" style="width: 36px; height: 36px; border-radius: 50%;">
      <i class="bi bi-eye"></i>
    </button>
    <button *ngIf="isAdmin" class="btn btn-sm d-flex align-items-center justify-content-center" (click)="editSkill()" title="Edit Skill" style="color: #f59e0b; width: 36px; height: 36px; border-radius: 50%;">
      <i class="bi bi-pencil"></i>
    </button>
    <button *ngIf="isAdmin" class="btn btn-sm d-flex align-items-center justify-content-center" (click)="onDelete()" title="Delete Skill" style="color: #ef4444; width: 36px; height: 36px; border-radius: 50%;">
      <i class="bi bi-trash"></i>
    </button>
  </ng-container>
</app-shared-card>
